<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المقرأة — مدير النظام</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
:root{--ol:#555942;--olD:#3F4230;--ink:#22241A;--ink2:#5F6150;--ink3:#8A8B7E;--line:#E8E6DE;--bg:#F7F7F5;--beige:#F3EFE3;--chip:#F1EBDA;--ok:#E7F6EC;--okT:#1F7A43;--err:#FDECEA;--errT:#B42318;--warn:#FFF4E0;--warnT:#9A5B0B;--info:#EEF1FF;--infoT:#3646B5;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E6E4DC;color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ptop{background:#2F3224;color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptop h1{margin:0;font-size:16px}.ptop p{margin:0;font-size:12px;color:#CBCDB8}
.pwrap{display:grid;grid-template-columns:250px 1fr;gap:20px;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.panel{background:#FBFAF6;border:1px solid var(--line);border-radius:14px;padding:10px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h2{font-size:11.5px;color:var(--ink3);margin:12px 8px 4px}
.sc{display:block;width:100%;text-align:start;padding:7px 9px;border-radius:9px;font-size:13px;color:var(--ink2);line-height:1.5}
.sc:hover{background:#EFEDE4}.sc[aria-current=true]{background:var(--ol);color:#fff}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font-size:13px;color:var(--ink2);text-align:center;max-width:760px;line-height:1.7}
.msel{display:none;width:100%}.msel select{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);padding:0 10px;background:#fff}
@media (max-width:900px){.pwrap{grid-template-columns:1fr}.panel{display:none}.msel{display:block}}
.fit{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 20px 50px -28px rgba(40,38,20,.55);width:100%}
.desk{width:1366px;height:820px;position:absolute;top:0;right:0;transform-origin:top right;background:var(--bg);display:flex;overflow:hidden}
/* app shell */
.side{width:250px;flex-shrink:0;background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column}
.logo{height:92px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #F0EEE7}
.logo span{width:46px;height:46px;border-radius:10px;background:var(--beige);display:grid;place-items:center;color:#8B2635;font-weight:800}
.logo b{display:block;font-size:14px}.logo small{font-size:11px;color:var(--ink3)}
.nav{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;color:#3A3C2E;text-decoration:none;cursor:pointer}
.nav a:hover{background:#F7F5EE}
.nav a.on{background:var(--beige);font-weight:700;border-inline-end:3px solid var(--ol)}
.nav a i{font-style:normal;font-size:10px;font-weight:700;background:#ECF6BC;color:var(--olD);border-radius:6px;padding:1px 6px;margin-inline-start:auto}
.nav .out{color:#B42318;margin-top:8px;border-top:1px solid #F0EEE7;padding-top:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:72px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.search{width:460px;height:42px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#9A988C;font-size:13px}
.me{display:flex;align-items:center;gap:12px}.me b{display:block;font-size:14px}.me small{font-size:12px;color:var(--ink3)}
.av{width:42px;height:42px;border-radius:10px;background:var(--beige);display:grid;place-items:center;font-weight:800;color:var(--ol)}
.body{flex:1;overflow:auto;padding:18px 26px 40px;display:flex;flex-direction:column;gap:16px;position:relative}
.crumb{font-size:12px;color:var(--ink3)}.crumb b{color:var(--ink2);font-weight:600}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ttl h2{margin:2px 0 0;font-size:22px;font-weight:800}
.ttl p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:9px;background:var(--ol);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn2{height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--ol);color:var(--ol);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn3{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.danger{color:var(--errT);border-color:#F3C7C2}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}.stat b{font-size:26px;display:block;margin-top:4px}.stat small{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 16px;font-weight:700;font-size:14px;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--ol)}
.tabs button .n{background:var(--chip);border-radius:9px;font-size:11px;padding:0 7px;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{background:#F7F7F4;color:var(--ink2);font-weight:600;font-size:12.5px;text-align:start;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid #F1EFE9;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.lnk{cursor:pointer}.t tbody tr.lnk:hover{background:#FBFAF6}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:#4A4C3C;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--okT)}.s-off{color:#8A8B7E}.s-warn{color:var(--warnT)}
.dots{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.dots:hover{background:#F2F0E9}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -12px rgba(0,0,0,.25);padding:6px;z-index:20;min-width:200px}
.menu button{display:flex;width:100%;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;font-size:13.5px;text-align:start}
.menu button:hover{background:#F6F4EE}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7}
.banner b{display:block}
.b-warn{background:var(--warn);color:var(--warnT)}.b-err{background:var(--err);color:var(--errT)}.b-info{background:var(--info);color:var(--infoT)}.b-ok{background:var(--ok);color:var(--okT)}.b-gray{background:#F1F0EB;color:#4A4B40}
.capbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.meter{flex:1;min-width:260px;height:12px;border-radius:6px;background:#EFEDE6;overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg span:before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 20px;color:var(--ink2);font-size:14px;line-height:1.8}
.empty .ill{width:72px;height:72px;border-radius:18px;background:var(--beige);display:grid;place-items:center;color:var(--ol);margin-bottom:6px}
.empty .ill svg{width:32px;height:32px}
.empty b{font-size:17px;color:var(--ink)}
/* forms */
.fsec{background:#fff;border:1px solid var(--line);border-radius:14px}
.fsec>h3{margin:0;padding:14px 18px;border-bottom:1px solid #F0EEE7;font-size:15px;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;padding:18px}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label{font-size:13.5px;font-weight:600}.f>label em{color:var(--errT);font-style:normal}
.f input,.f select,.f textarea{height:44px;border:1px solid #DDDACF;border-radius:10px;padding:0 12px;background:#fff;font-size:14px;width:100%}
.f textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink3)}
.f.bad input,.f.bad select{border-color:#E5534B;background:#FFFBFA}
.f .msg{font-size:12px;color:var(--errT);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{height:42px;padding:0 16px;border:1px solid #DDDACF;border-radius:10px;font-size:14px;background:#fff}
.seg button[aria-pressed=true]{border-color:var(--ol);background:#F5F6EE;font-weight:700;box-shadow:inset 0 0 0 1px var(--ol)}
.rte{border:1px solid #DDDACF;border-radius:10px;overflow:hidden}
.rte .tb{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #EEECE5;color:var(--ink3);font-size:13px}
.rte .tx{padding:12px;min-height:80px;font-size:13.5px;line-height:1.9}
.upl{border:1.5px dashed #D7D3C5;border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:13px}
.copy{display:flex;align-items:center;gap:8px;border:1px solid #DDDACF;border-radius:10px;padding:0 6px 0 12px;height:44px;background:#FAFAF7}
.copy code{flex:1;direction:ltr;text-align:left;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:44px;height:26px;border-radius:13px;background:#D6D3C7;position:relative;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked=true]{background:var(--okT)}.sw[aria-checked=true]:after{right:21px}
.foot{display:flex;gap:10px;justify-content:flex-start}
.ms{display:flex;gap:6px;flex-wrap:wrap;border:1px solid #DDDACF;border-radius:10px;padding:7px;min-height:44px;align-items:center;background:#fff}
.ms .chip button{display:grid;place-items:center;color:var(--ink3)}
.branch{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:12px;align-items:end;background:#FCFCFA}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
/* overlays */
.dim{position:absolute;inset:0;background:rgba(25,26,18,.42);display:grid;place-items:center;z-index:30}
.modal{background:#fff;border-radius:16px;width:560px;max-width:92%;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;max-height:90%}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #F0EEE7}
.modal .mh b{font-size:16px}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.modal .mf{display:flex;gap:10px;padding:14px 18px;border-top:1px solid #F0EEE7}
.modal .mf .btn,.modal .mf .btn2{flex:1;justify-content:center}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line)}
.toast{position:absolute;top:86px;left:50%;transform:translateX(-50%);background:#22241A;color:#fff;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;z-index:40;display:flex;gap:8px;align-items:center}
.sk{background:linear-gradient(90deg,#EFEDE6 0,#F7F6F1 50%,#EFEDE6 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.msgs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mcard{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.mcard h4{margin:0;background:#C9BC9B;color:#2C2E22;padding:12px;font-size:14px;text-align:center}
.mcard p{margin:0;padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.8;flex:1;white-space:pre-line;max-height:120px;overflow:hidden}
.mcard .ma{display:flex;gap:8px;padding:10px 12px}
.mcard .ma button{flex:1;height:36px;border-radius:8px;font-size:13px;font-weight:600}
.on1{background:#22A04B;color:#fff}.off1{background:#D64541;color:#fff}.ed{border:1px solid var(--line);background:#fff}
.tag{position:absolute;margin:8px;font-size:10.5px;font-weight:700;background:var(--ol);color:#fff;border-radius:6px;padding:1px 7px}
.ucard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ucard .k{font-size:11.5px;color:var(--ink3)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.p-ok{background:var(--ok);color:var(--okT)}.p-err{background:var(--err);color:var(--errT)}
.dkcol{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;font-size:13.5px;padding:16px 18px}
.kv span{color:var(--ink3)}
/* supervisor additions */
.rolebar{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBFAF6;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--ink2)}
.rolebar b{color:var(--ink)}
.rolebar .seg button{height:34px;font-size:12.5px;padding:0 12px}
.nav .sub{display:flex;flex-direction:column;gap:2px;padding-inline-start:28px}
.nav .sub a{font-size:13px;padding:7px 12px}
.nav a .chev{margin-inline-start:auto;font-size:11px;color:var(--ink3)}
.sect{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sect h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.sect .sub2{font-size:12.5px;color:var(--ink3)}
.kcards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:4px;background:#fff;min-height:104px}
.kc:hover{border-color:#CFCBBB;background:#FCFBF7}
.kc span{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kc b{font-size:24px}
.kc small{font-size:12px;color:var(--ink3)}
.kc.act{border-color:#F0D9A8;background:#FFFBF2}.kc.act b{color:var(--warnT)}
.kc.zero b{color:var(--ink3)}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcard{border-radius:12px;background:#F7F5EE;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard b{font-size:20px;display:block}.tcard span{font-size:13px;color:var(--ink2)}.tcard small{font-size:12px;color:var(--ink3)}
.lk{color:var(--ol);font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px;border-bottom:1px solid #F1EFE9}
.filters .f select{height:38px;font-size:13px}
.filters .f label{font-size:12px;font-weight:600;color:var(--ink2)}
.nw{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9BB52C;margin-inline-start:4px;vertical-align:middle}
.rank{width:26px;height:26px;border-radius:8px;background:var(--beige);display:grid;place-items:center;font-weight:800;font-size:12.5px;color:var(--olD)}
.t .s2{display:block;font-size:12px;color:var(--ink3);font-weight:400}
.sel2{height:34px;border:1px solid #DDDACF;border-radius:8px;padding:0 8px;background:#fff;font-size:13px;min-width:110px}
.menu button[disabled]{opacity:.5;cursor:not-allowed}
.menu .why{font-size:11.5px;color:var(--errT);padding:0 10px 6px 10px;max-width:220px;line-height:1.5}
.steps{display:flex;gap:6px;padding:12px 18px;border-bottom:1px solid #F0EEE7;background:#FCFBF8}
.steps div{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);font-weight:600}
.steps i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1.5px solid #D6D3C7;display:grid;place-items:center;font-size:12px}
.steps .on{color:var(--ink)}.steps .on i{background:var(--ol);border-color:var(--ol);color:#fff}
.steps .dn i{background:var(--ok);border-color:#BFE3CB;color:var(--okT)}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;background:#F7F6F1;border-radius:12px;padding:12px 14px;font-size:13px}
.who span{display:block;font-size:11.5px;color:var(--ink3)}
.hc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;text-align:start;width:100%;background:#fff}
.hc:hover:not([disabled]){border-color:#C9C5B4}
.hc[aria-pressed=true]{border-color:var(--ol);box-shadow:inset 0 0 0 1px var(--ol);background:#FAFBF5}
.hc[disabled]{background:#FAFAF8;cursor:not-allowed}.hc[disabled] .hn{color:var(--ink3)}
.hc .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid #CFCBBB}
.hc[aria-pressed=true] .rd{border:5px solid var(--ol)}
.hc .hn{font-weight:700;font-size:14px}
.hc .hm{font-size:12.5px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.seats{font-size:12.5px;font-weight:700;text-align:center}.seats small{display:block;font-weight:400;color:var(--ink3);font-size:11px}
.match{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.m-yes{background:var(--ok);color:var(--okT)}.m-no{background:#F1F0EB;color:var(--ink2)}.m-bad{background:var(--err);color:var(--errT)}
.wa{background:#E7F3E5;border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:13px;line-height:1.8;white-space:pre-line;color:#1F2A1C;max-width:360px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer}
.rlist label.on{border-color:var(--ol);background:#FAFBF5}
.rlist input{accent-color:var(--ol);width:16px;height:16px}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.togs button{height:36px;padding:0 12px;border:1px solid #DDDACF;border-radius:9px;font-size:13px;background:#fff}
.togs button[aria-pressed=true]{background:var(--ol);border-color:var(--ol);color:#fff;font-weight:700}
.togs button[disabled]{opacity:.4;cursor:not-allowed}
.req{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;background:#FAFAF7}

/* ---------- in maqraa ---------- */
function inmq(){
 return `<div style="flex:1;display:flex;flex-direction:column;min-width:0"><div style="background:var(--olD);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:12px;font-size:13.5px">${ic('maqraa')}<span style="flex:1">أنت داخل <b>مقرأة النور الإلكترونية</b> كمدير نظام · يُسجَّل الدخول في سجل التغييرات</span><button class="btn2" style="height:34px;background:transparent;color:#fff;border-color:rgba(255,255,255,.6)" data-act="back">${ic('back')}العودة إلى المجمع</button></div>
 <div style="flex:1;display:grid;place-items:center;background:var(--bg)"><div class="card pad" style="max-width:520px;text-align:center;display:flex;flex-direction:column;gap:8px"><b style="font-size:17px">حساب المقرأة</b><span style="font-size:13.5px;color:var(--ink2);line-height:1.8">تظهر هنا شاشات حساب المقرأة كما في تصميم مشرف المقرأة. صلاحيات مدير النظام داخلها: [مفتوح — يحتاج تحديد].</span></div></div>${overlay()}</div>`;
}
function overlay(){let h='';if(S.toast)h+=`<div class="toast">${ic('ok')}${S.toast}</div>`;return h}
/* ---------- render/actions ---------- */
const V={home,req,teacher};
function render(){const d=document.getElementById('desk'),b=d.querySelector('#bd'),t=b?b.scrollTop:0;d.innerHTML=S.inMq?inmq():V[S.scr]();const nb=d.querySelector('#bd');if(nb&&S.keep)nb.scrollTop=t;S.keep=false;const nv=d.querySelector('.nav'),on=d.querySelector('.nav .sub a.on');if(nv&&(on||S.navEnd))nv.scrollTop=S.navEnd?nv.scrollHeight:on.offsetTop-300;fit();sync()}
let tt;function say(m){S.toast=m;S.keep=true;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;S.keep=true;render()},2300)}
const K=()=>{S.keep=true;render()};
function check(){const f=S.f,e={};if(!f.name.trim())e.name='اسم المقرأة مطلوب';if(!(+f.cap>0))e.cap='أدخل عددًا صحيحًا';if(f.sk==='ex'){if(!f.sp)e.sp='اختر المشرف'}else{if(!f.sn.trim())e.sn='الاسم مطلوب';if(!f.sph.trim())e.sph='رقم الجوال مطلوب';if(!f.sg)e.sg='الجنس إلزامي'}return e}
const A={
 go(d){S.scr=d.v;S.terr=null;render()},say(d){say(d.v)},
 sk(d){S.f.sk=d.v;['sp','sn','sph','sg'].forEach(k=>delete S.err[k]);K()},sg(d){S.f.sg=d.v;delete S.err.sg;K()},
 send(){S.err=check();if(Object.keys(S.err).length){K();return}S.req='pend';say('أُرسل الطلب لإدارة المنصة')},
 newreq(){S.req='none';S.err={};S.f.cap='';K()},
 enter(){S.inMq=true;render()},back(){S.inMq=false;say('عدت إلى حساب المجمع')},retry(){S.loadErr=false;K()},
 tg(d){S.t.g=S.t.g===d.v?'':d.v;if(!S.t.g)S.t.link=false;K()},
 link(d,e){if(S.t.link&&S.t.hal){e.preventDefault();S.terr='المعلم مسند لحلقة «الأعشار المسائية» في المقرأة. يفك مشرف المقرأة الإسناد أولًا.';K();return}S.t.link=!S.t.link;S.terr=null;K()},
};
const desk=()=>document.getElementById('desk');
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!desk().contains(el))return;A[el.dataset.act]&&A[el.dataset.act]({...el.dataset},e)});
document.addEventListener('input',e=>{const t=e.target;if(!desk().contains(t))return;if(t.dataset.in){S.f[t.dataset.in]=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(!desk().contains(t))return;if(t.dataset.sel){S.f[t.dataset.sel]=t.value;delete S.err[t.dataset.sel];K()}});
function fit(){const f=document.getElementById('fit'),sc=Math.min(1,f.clientWidth/1366);desk().style.transform=`scale(${sc})`;f.style.height=820*sc+'px'}
window.addEventListener('resize',fit);
const st=o=>()=>{S=Object.assign(fresh(),o)};
const SC=[
 ['g','طلب المقرأة (FR-01)'],
 ['الإعدادات ← طلب مقرأة إلكترونية',st({scr:'req'}),'مدخل جديد في الإعدادات بعد «تجديد الاشتراك»، لمدير النظام في جهة باقة المجمع فقط. جرّب «إرسال الطلب» فارغًا.'],
 ['المشرف الأول — مشرف جديد',st({scr:'req',f:Object.assign(fresh().f,{name:'مقرأة النور الإلكترونية',cap:'200',sk:'new'})}),'الجنس إلزامي (D140). يُنشأ الحساب عند القبول.'],
 ['أخطاء التحقق',()=>{S=fresh();S.scr='req';S.err=check()},''],
 ['قيد المراجعة',st({scr:'req',req:'pend'}),'لا يمكن تقديم طلب آخر.'],
 ['مقبول',st({scr:'req',req:'ok'}),'السعة المعتمدة من إدارة المنصة، وأُنشئ حساب المشرف الأول.'],
 ['مرفوض — طلب جديد',st({scr:'req',req:'no'}),'السبب ظاهر، و«طلب جديد» يفتح النموذج.'],
 ['g','الرئيسية والدخول (FR-02، FR-03)'],
 ['الرئيسية — قبل القبول',st({}),'لا شيء عن المقرأة في الرئيسية قبل القبول.'],
 ['الرئيسية — بطاقة المقرأة',st({req:'ok'}),'للاطلاع فقط، وزر «الدخول إلى المقرأة».'],
 ['البطاقة — تعذر التحميل',st({req:'ok',loadErr:true}),''],
 ['البطاقة — لا بيانات كافية',st({req:'ok',noData:true}),''],
 ['داخل المقرأة — العودة',st({req:'ok',inMq:true}),'شريط ثابت يوضح أنك داخل المقرأة، مع «العودة إلى المجمع».'],
 ['g','ربط المعلم (FR-04)'],
 ['تعديل معلم — ربط بالمقرأة',st({scr:'teacher',req:'ok'}),'checkbox جديد في صفحة عرض/تعديل المعلم.'],
 ['معلم بلا جنس',st({scr:'teacher',req:'ok',t:{g:'',link:false,hal:false}}),'الربط معطّل حتى يُسجَّل الجنس.'],
 ['إلغاء ربط معلم مسند لحلقات',st({scr:'teacher',req:'ok',t:{g:'ذكر',link:true,hal:true}}),'اضغط الـ checkbox لترى المنع.'],
 ['g','العزل (FR-05)'],
 ['مشرف حلقات — الرئيسية',st({req:'ok',role:'sup'}),'لا بطاقة مقرأة.'],
 ['مشرف حلقات — الإعدادات والمعلم',st({scr:'teacher',req:'ok',role:'sup',navEnd:true}),'لا مدخل طلب في الإعدادات، ولا checkbox في المعلم.'],
 ['جهة باقة مسجد',st({pkg:'mosque',navEnd:true}),'لا يظهر مدخل الطلب في الإعدادات.'],
];
let cur=1;
function run(i){if(SC[i][0]==='g')return;cur=i;SC[i][1]();document.getElementById('cap').textContent=SC[i][2]||'';render()}
function sync(){document.querySelectorAll('.sc').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===cur));document.getElementById('msel').value=cur}
document.getElementById('list').innerHTML=SC.map((s,i)=>s[0]==='g'?`<h2>${s[1]}</h2>`:`<button class="sc" data-i="${i}">${s[0]}</button>`).join('');
document.getElementById('msel').innerHTML=SC.map((s,i)=>s[0]==='g'?`<option disabled>— ${s[1]} —</option>`:`<option value="${i}">${s[0]}</option>`).join('');
document.getElementById('list').onclick=e=>{const b=e.target.closest('.sc');if(b)run(+b.dataset.i)};
document.getElementById('msel').onchange=e=>run(+e.target.value);
run(1);

</script>

</body></html>
