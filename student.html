<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المقرأة — الطالب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--g:#F2F2EE;--ol:#555942;--olD:#3F4230;--olC:#5A5D45;--olK:#313425;--ink:#1C1E14;--ink2:#5F6150;--ink3:#8A8B7E;--line:#E5E3DA;--beige:#F5F0E5;--tag:#EADFC4;--lime:#ECF6BC;--ok:#E7F5EC;--okT:#1E6B39;--err:#FDECEA;--errT:#B42318;--warn:#FFF4E0;--warnT:#8A520A;--info:#EEF1FF;--infoT:#3646B5;--mar:#8B2635;--gold:#B08D3C;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E7E5DD;color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.top{background:#2F3224;color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{margin:0;font-size:16px}.top p{margin:0;font-size:12px;color:#CBCDB8}
.wrap{max-width:1150px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:28px;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:#FBFAF6;border:1px solid var(--line);border-radius:16px;padding:10px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h2{font-size:11.5px;color:var(--ink3);margin:12px 8px 4px}
.sc{display:block;width:100%;text-align:start;padding:7px 9px;border-radius:9px;font-size:13px;color:var(--ink2);line-height:1.5}
.sc:hover{background:#EFEDE4}.sc[aria-current=true]{background:var(--ol);color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.cap{max-width:440px;text-align:center;font-size:13px;color:var(--ink2);line-height:1.7}
.msel{display:none;width:100%}.msel select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);padding:0 10px;background:#fff}
@media (max-width:780px){.wrap{grid-template-columns:1fr}.panel{display:none}.msel{display:block}}
.phone{box-sizing:content-box;width:390px;max-width:calc(100vw - 52px);height:844px;border:10px solid #1B1C15;border-radius:48px;background:var(--g);position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(40,38,20,.5)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.sb{height:44px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:15px;font-weight:700;direction:ltr;position:relative;z-index:2}
.sb.w{color:#fff}
.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.13;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.col{display:flex;flex-direction:column}
/* ---------- web ---------- */
.url{margin:0 12px 8px;height:38px;border-radius:12px;background:#E9E8E2;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#4A4B40;direction:ltr;flex-shrink:0}
.web{flex:1;overflow-y:auto;background:#F7F7F5;scrollbar-width:none}
.wh{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 16px 6px;text-align:center}
.logo .mk{width:56px;height:56px;border-radius:14px;background:#F7EDEE;color:var(--mar);display:grid;place-items:center;font-weight:800;font-size:24px}
.logo b{color:var(--mar);font-size:17px}.logo small{color:var(--gold);font-size:12px}
.wb{padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
.wb h2{margin:4px 0 0;font-size:20px;text-align:center}
.wb .lead{margin:0;text-align:center;font-size:13.5px;color:var(--ink2);line-height:1.8}
.choice{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;text-align:start;width:100%;min-height:76px}
.choice:hover{border-color:#C9C5B4}
.choice .ci{width:46px;height:46px;border-radius:12px;background:var(--beige);color:var(--ol);display:grid;place-items:center;flex-shrink:0}
.choice b{font-size:15.5px;display:block}.choice small{font-size:12.5px;color:var(--ink2);line-height:1.6;display:block}
.choice[disabled]{opacity:.55;cursor:not-allowed}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pimg{height:96px;background:var(--olC);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px 14px;color:#fff}
.pimg b{position:relative;font-size:17px}
.pb{padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink2);line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--beige);border-radius:999px;padding:2px 10px;font-size:12px;color:#4A4C3C;white-space:nowrap}
.slots{background:#F7F6F1;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink)}
.slots span{display:block}
.btn{height:48px;border-radius:12px;background:var(--ol);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn[disabled]{background:#E3E2DC;color:#8F8F85;cursor:not-allowed}
.btn2{height:48px;border-radius:12px;border:1.5px solid var(--ol);color:var(--ol);background:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.fsec{background:#fff;border:1px solid var(--line);border-radius:14px}
.fsec>h3{margin:0;padding:12px 14px;border-bottom:1px solid #F0EEE7;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.fgrid{display:flex;flex-direction:column;gap:12px;padding:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f>label{font-size:13px;font-weight:600}.f>label em{color:var(--errT);font-style:normal}
.f input,.f select,.f textarea{height:46px;border:1px solid #DDDACF;border-radius:10px;padding:0 12px;background:#fff;font-size:14px;width:100%}
.f textarea{height:auto;min-height:84px;padding:10px 12px;resize:none}
.f .hint{font-size:11.5px;color:var(--ink3);line-height:1.6}
.f.bad input,.f.bad select,.f.bad textarea,.f.bad .seg button{border-color:#E5534B}
.f .msg{font-size:12px;color:var(--errT);font-weight:600;line-height:1.6}
.ph{display:flex;border:1px solid #DDDACF;border-radius:10px;overflow:hidden;height:46px;direction:ltr}
.ph span{padding:0 10px;display:flex;align-items:center;background:#F7F6F1;font-size:13.5px;border-inline-end:1px solid #DDDACF}
.ph input{border:0;border-radius:0;height:44px;text-align:right}
.f.bad .ph{border-color:#E5534B}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:44px;border:1px solid #DDDACF;border-radius:10px;font-size:14px;background:#fff}
.seg button[aria-pressed=true]{border-color:var(--ol);background:#F5F6EE;font-weight:700;box-shadow:inset 0 0 0 1px var(--ol)}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.togs button{height:36px;padding:0 12px;border:1px solid #DDDACF;border-radius:9px;font-size:13px;background:#fff}
.togs button[aria-pressed=true]{background:var(--ol);border-color:var(--ol);color:#fff;font-weight:700}
.slot{border:1.5px solid #DDDACF;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:start;width:100%;background:#fff}
.slot[aria-pressed=true]{border-color:var(--ol);background:#FAFBF5}
.slot .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid #CFCBBB;flex-shrink:0}
.slot[aria-pressed=true] .rd{border:5px solid var(--ol)}
.slot b{font-size:14px;display:block}.slot small{font-size:12px;color:var(--ink3)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7}
.banner b{display:block;font-size:13px}
.b-err{background:var(--err);color:var(--errT)}.b-warn{background:var(--warn);color:var(--warnT)}.b-info{background:var(--info);color:var(--infoT)}.b-ok{background:var(--ok);color:var(--okT)}.b-gray{background:#EFEEE8;color:#45473A}
.tz{display:flex;align-items:center;gap:8px;background:#F7F6F1;border-radius:10px;padding:8px 10px;font-size:12.5px}
.tz select{height:30px;border:1px solid #DDDACF;border-radius:8px;font-size:12.5px;padding:0 6px;background:#fff;margin-inline-start:auto}
.steps{display:flex;gap:4px;justify-content:center;font-size:11.5px;color:var(--ink3)}
.steps span{display:flex;align-items:center;gap:4px}.steps i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1.5px solid #CFCBBB;display:grid;place-items:center;font-size:10px}
.steps .on{color:var(--ink);font-weight:700}.steps .on i{background:var(--ol);border-color:var(--ol);color:#fff}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 4px}
.done .big{width:76px;height:76px;border-radius:50%;background:var(--ok);color:var(--okT);display:grid;place-items:center}
.done .big svg{width:36px;height:36px}
.nexts{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:start;width:100%}
.nexts div{display:flex;gap:10px;font-size:13px;line-height:1.7}
.nexts i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--beige);color:var(--ol);font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:12px}
.stores{display:flex;gap:8px;width:100%}
.stores span{flex:1;height:44px;border-radius:10px;background:#1C1E14;color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}
/* ---------- app ---------- */
.hdr{background:var(--ol);color:#fff;margin-top:-44px;padding:52px 18px 18px;border-radius:0 0 26px 26px;position:relative;overflow:hidden;flex-shrink:0}
.hdr>*:not(.pat){position:relative}
.ic{width:44px;height:44px;border-radius:50%;background:var(--olK);display:grid;place-items:center;color:#fff;position:relative}
.bd{position:absolute;top:-3px;right:-3px;background:#DC2626;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px;line-height:18px;font-style:normal}
.coin{height:44px;border-radius:22px;background:var(--olK);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:700}
.scr{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.scr>*{flex-shrink:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--ol);color:#fff;border-radius:14px;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;font-weight:700;position:relative;overflow:hidden}
.card{background:#fff;border-radius:16px}
.lesson{padding:14px;display:flex;gap:12px;align-items:center}
.lsi{width:44px;height:44px;border-radius:12px;background:var(--ol);display:grid;place-items:center;color:#fff;flex-shrink:0}
.tab{flex-shrink:0;background:var(--ol);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 26px;gap:4px}
.tab span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--beige);padding:6px 4px;border-radius:12px}
.tab span.on{background:var(--beige);color:var(--ol)}
/* halaqa card */
.hq{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line)}
.hq.live{background:var(--ol);border-color:var(--ol);color:#fff}
.hq .k{font-size:13px;color:var(--ink3);font-weight:600}
.hq.live .k{color:#fff;font-weight:700}
.tg{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tag);color:#3C382E;white-space:nowrap}
.tg2{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F1F0EB;color:#3B3D33;white-space:nowrap}
.hq.live .tg{background:var(--lime);color:var(--olK)}.hq.live .tg2{background:#464936;color:var(--beige)}
.hq h3{margin:0;font-size:20px;font-weight:800}
.hq .sub{font-size:14px;color:#374151}.hq .sub2{font-size:13px;color:var(--ink3)}
.hq.live .sub{color:var(--beige)}.hq.live .sub2{color:var(--tag)}
.cd{display:flex;align-items:center;gap:4px;background:var(--beige);color:#585345;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap}
.hq.live .cd{background:var(--olK);color:#fff}
.go{height:56px;border-radius:14px;background:#fff;color:var(--ol);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.go.off{height:48px;background:#ECEBE6;color:#7A7B70;font-size:16px;cursor:not-allowed}
.go.re{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7);height:50px;font-size:16px}
.hq .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3)}
.hq.live .ft{color:var(--tag);justify-content:center}
.lnk{font-size:13px;font-weight:700;color:var(--ol);padding:10px 0;min-height:44px;display:inline-flex;align-items:center}
.dotg{width:8px;height:8px;border-radius:50%;background:#86EFAC;display:inline-block}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.car>.hq{flex:0 0 88%;scroll-snap-align:center}
.pdots{display:flex;gap:6px;justify-content:center;margin-top:-4px}.pdots i{width:6px;height:6px;border-radius:50%;background:#CFCBBB}.pdots i.on{background:var(--ol);width:16px;border-radius:3px}
.reqb{display:flex;align-items:center;gap:8px;background:var(--info);color:var(--infoT);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600}
.hq.live .reqb{background:#464936;color:#fff}
/* inner page */
.ih{background:var(--ol);color:#fff;margin-top:-44px;padding:52px 16px 16px;border-radius:0 0 24px 24px;position:relative;overflow:hidden;flex-shrink:0}
.ih>*:not(.pat){position:relative}
.ih h2{margin:10px 2px 0;font-size:22px;font-weight:800}.ih p{margin:2px 2px 0;font-size:13px;color:var(--tag)}
.back{width:44px;height:44px;border-radius:50%;background:var(--olK);display:grid;place-items:center;color:#fff}
.pform{border:1px solid #D9D7CE;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.fld{display:flex;flex-direction:column;gap:5px}.fld span{font-size:13.5px}
.fld input{height:44px;border:1px solid #D9D7CE;border-radius:10px;padding:0 12px;font-size:14px;color:#8A8B80;background:#fff}
.logout{height:52px;border-radius:12px;background:#B4271C;color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.rq{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:start}
.rq+.rq{border-top:1px solid #EFEDE5}
.rq b{font-size:14px;display:block}.rq small{font-size:12px;color:var(--ink2);display:block;line-height:1.6}
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.s-open{background:var(--warn);color:var(--warnT)}.s-ok{background:var(--ok);color:var(--okT)}.s-no{background:#EFEEE8;color:#55574A}.s-err{background:var(--err);color:var(--errT)}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;background:#FAFAF7}
.addf{border:1.5px dashed #D2CEBF;border-radius:12px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--ink2);width:100%}
.tl{display:flex;flex-direction:column;gap:0;padding:4px 2px}
.tl div{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.tl div:not(:last-child):after{content:"";position:absolute;right:11px;top:26px;bottom:2px;width:2px;background:#E2E0D6}
.tl i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0;background:#ECEBE6;color:#9A9A8E;position:relative;z-index:1}
.tl .dn i{background:var(--okT);color:#fff}.tl .cu i{background:var(--ol);color:#fff;box-shadow:0 0 0 4px #E5E7D6}
.tl b{font-size:14px;display:block}.tl small{font-size:12px;color:var(--ink2)}
.tl .fu b{color:var(--ink3)}
.meta{padding:2px 14px}
.meta div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;font-size:13px;border-bottom:1px solid #EFEDE5}
.meta div:last-child{border:0}.meta span{color:var(--ink2)}.meta b{text-align:end}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr}
.otp span{width:56px;height:60px;border-radius:12px;border:1.5px solid #D9D7CE;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.otp span.on{border-color:var(--ol)}
/* overlays */
.push{position:absolute;top:50px;left:10px;right:10px;z-index:8;background:rgba(250,250,247,.97);border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:start;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);animation:dn .25s ease}
@keyframes dn{from{transform:translateY(-12px);opacity:0}}
.dim{position:absolute;inset:0;background:rgba(20,20,14,.45);z-index:9;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:10px 18px 30px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D9D7CE;align-self:center}
.sheet h4{margin:0;font-size:17px;text-align:center}
.sheet p{margin:0;font-size:13.5px;color:var(--ink2);text-align:center;line-height:1.8}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #E5E7D6;border-top-color:var(--ol);animation:sp .9s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#23251C;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;z-index:10;white-space:nowrap}
.offline{background:#3B3D33;color:#fff;font-size:12.5px;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.sk{background:linear-gradient(90deg,#ECEBE5 0,#F6F5F1 50%,#ECEBE5 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.ltr{direction:ltr;unicode-bidi:isolate}
</style>
</head><body>

<div dir="rtl" lang="ar">
<header class="top"><h1>المقرأة الإلكترونية · الطالب (ويب عام + تطبيق)</h1><p>نموذج تفاعلي مبني على استمارة الانضمام وتطبيق الطالب الحاليين · بيانات افتراضية · الآن الثلاثاء 5:54 م بتوقيت الطالب (القاهرة)</p></header>
<div class="wrap">
 <aside class="panel" id="list"></aside>
 <main class="stage">
  <div class="msel"><select id="msel" aria-label="الشاشة"></select></div>
  <div class="phone" id="ph"></div>
  <div class="cap" id="cap"></div>
 </main>
</div>
</div>

<script>
const sv=p=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
