<style>

*{box-sizing:border-box}
body{margin:0;background:#E6E4DC;color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}

.stage{min-width:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font-size:13px;color:var(--ink2);text-align:center;max-width:760px;line-height:1.7}
.msel{display:none;width:100%}.msel select{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);padding:0 10px;background:#fff}

.fit{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 20px 50px -28px rgba(40,38,20,.55);width:100%}

.search{width:460px;height:42px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#9A988C;font-size:13px}

.sk{background:linear-gradient(90deg,#EFEDE6 0,#F7F6F1 50%,#EFEDE6 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}

.mcard{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}

/* ---------- render & actions ---------- */
function render(){const d=document.getElementById('desk'),b=d.querySelector('#bd'),t=b?b.scrollTop:0;
 d.innerHTML=S.scr==='home'?home():S.scr==='mlist'?mlist():S.scr==='mform'?mform():S.scr==='mpage'?mpage():S.scr==='pform'?pform():S.scr==='teacher'?teacher():S.scr==='msgs'?msgs():sub();
 const nb=d.querySelector('#bd');if(nb&&S.keep)nb.scrollTop=t;S.keep=false;fit();sync()}
let tt;function say(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;S.keep=true;render()},2200)}
const A={
 go(d){S.scr=d.v;S.menu=null;S.modal=null;if(d.tab)S.tab=d.tab;if(d.v==='mform'){S.editing=d.edit||null;S.err={};const m=S.maq.find(x=>x.id===d.edit);S.f=m?{name:m.name,gender:m.gender,age:m.age,desc:m.desc,ins:''}:{name:'',gender:'',age:10,desc:'',ins:''}}render()},
 tab(d){S.tab=d.v;S.keep=true;render()},mtab(d){S.mtab=d.v;S.keep=true;render()},
 open(d,e){if(e.target.closest('[data-act="copy"],[data-act="menu"],.menu'))return;S.sel=d.v;S.mtab='ov';S.scr='mpage';render()},
 menu(d){S.menu=S.menu===d.v?null:d.v;S.keep=true;render()},
 copy(d){S.menu=null;S.keep=true;say('نُسخ رابط الانضمام: ethaaf.com/join/'+d.v)},
 regask(d){S.menu=null;S.modal={t:'reg',id:d.v};S.keep=true;render()},
 regdo(d){const m=S.maq.find(x=>x.id===d.v);m.reg=!m.reg;S.modal=null;S.keep=true;say(m.reg?'فُتح التسجيل في '+m.name:'أُوقف التسجيل في '+m.name)},
 delask(d){S.menu=null;S.modal={t:'del',id:d.v};S.keep=true;render()},
 close(d,e){if(e&&e.target.closest('[data-stop]')&&!e.target.closest('[data-act="close"]'))return;S.modal=null;S.keep=true;render()},
 fset(d){S.f[d.k]=d.v;delete S.err[d.k];S.keep=true;render()},
 msave(){const f=S.f,e={};if(!f.name.trim())e.name='اسم المقرأة مطلوب';else if(S.maq.some(m=>m.name===f.name.trim()&&m.id!==S.editing))e.name='يوجد مقرأة بهذا الاسم في المجمع';if(!f.gender)e.gender='اختر الجنس المستهدف';if(!(+f.age>0))e.age='أدخل عمرًا صحيحًا';S.err=e;
  if(Object.keys(e).length){render();return}
  if(S.editing){Object.assign(S.maq.find(m=>m.id===S.editing),{name:f.name,gender:f.gender,age:+f.age,desc:f.desc});S.scr='mlist';say('حُفظت التعديلات');return}
